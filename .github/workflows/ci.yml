name: My First CI Workflow

# 1. Trigger: When should this run?
on:
  push:
    branches: [ "main" ]

# 2. Jobs: What tasks need to happen?
jobs:
  build-and-test:
    # 3. Runner: Which virtual machine runs this job?
    runs-on: ubuntu-latest

    # 4. Steps: Sequential commands or pre-built actions
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Run a simple shell script
        run: |
          echo "Hello from GitHub Actions!"
          ls -la
